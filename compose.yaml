services:
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    image: eventhub
    container_name: eventhub-web
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - "redis"
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  worker:
    image: eventhub
    container_name: eventhub-worker
    env_file:
      - .env
    command: celery -A core worker -l info --pool=solo
    depends_on:
      - redis
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  beat:
    image: eventhub
    container_name: eventhub-beat
    env_file:
      - .env
    command: celery -A core beat -l info
    depends_on:
      - redis
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0